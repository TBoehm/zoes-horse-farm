<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horse demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc3e6;
        font:
          13px system-ui,
          sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: fixed;
        top: 8px;
        left: 8px;
        background: rgba(255, 255, 255, 0.88);
        padding: 8px 10px;
        border-radius: 8px;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 8px;
        align-items: center;
        max-width: 300px;
      }
      #ui button {
        font: inherit;
      }
      #info {
        grid-column: 1 / 3;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      #ui.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <label for="gait">Gait</label>
      <select id="gait">
        <option value="halt">Halt</option>
        <option value="walk">Walk</option>
        <option value="trot">Trot</option>
        <option value="canter">Canter</option>
      </select>
      <label for="speed">Speed <span id="speedv"></span></label>
      <input id="speed" type="range" min="0" max="8" step="0.1" value="0" />
      <label for="turn">Turn <span id="turnv"></span></label>
      <input id="turn" type="range" min="-1.5" max="1.5" step="0.05" value="0" />
      <label for="move">Move forward</label>
      <input id="move" type="checkbox" checked />
      <label for="coat">Coat</label>
      <select id="coat"></select>
      <label for="marking">Marking</label>
      <select id="marking"></select>
      <label for="quality">Quality</label>
      <select id="quality">
        <option>low</option>
        <option selected>medium</option>
        <option>high</option>
      </select>
      <label for="rider">Rider</label>
      <input id="rider" type="checkbox" checked />
      <label for="slow">Slow motion</label>
      <input id="slow" type="checkbox" />
      <button id="jump">Jump</button>
      <button id="hop">Hop</button>
      <button id="stop">Refuse (stop)</button>
      <button id="runout">Run out</button>
      <div id="info"></div>
    </div>
    <script type="module" src="./horse.js"></script>
  </body>
</html>
