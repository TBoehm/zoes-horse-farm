# Overrides on top of detekt's default rule set (buildUponDefaultConfig).
# Formatting is ktlint's job; detekt checks complexity, potential bugs, naming and style.

style:
  ReturnCount:
    max: 3
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    # Game values live in Tuning.kt (CLAUDE.md). Adapters build geometry, colours, sounds and
    # layouts from literal numbers, as the web app does; tests and fixtures use literals freely.
    excludes:
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/iosTest/**'
      - '**/*-testing/**'
      - '**/adapters/**'
      - '**/Tuning.kt'

naming:
  FunctionNaming:
    # geometry builders keep the three.js type names (BoxGeometry(...)) like factory functions
    functionPattern: '[a-z][a-zA-Z0-9]*|[A-Z][a-zA-Z0-9]*Geometry'
    ignoreAnnotated:
      - 'Composable'

complexity:
  TooManyFunctions:
    # facades of the ported web modules (audio, sessions, world) expose many small operations
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerInterface: 20
    ignorePrivate: true
